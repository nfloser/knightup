name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
  release:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify published assets
        run: |
          python - <<'PY'
          import json, time, urllib.request
          base = 'https://nfloser.github.io/knightup/'
          for path in ['', 'puzzles.json', 'engine/SOURCE.txt', 'engine/stockfish-19-lite-single.wasm']:
              for attempt in range(5):
                  try:
                      with urllib.request.urlopen(base + path, timeout=20) as response:
                          data = response.read()
                          assert response.status == 200 and data
                          if path == 'puzzles.json':
                              assert len(json.loads(data)) == 4000
                          if path.endswith('.wasm'):
                              assert data[:4] == b'\x00asm'
                      break
                  except Exception:
                      if attempt == 4:
                          raise
                      time.sleep(5)
              print('Published asset verified:', path or '/')
          PY
      - name: Publish versioned release when notes exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p 'require("./package.json").version')
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Invalid release version'; exit 1
          fi
          notes="docs/RELEASE-${version%.*}.md"
          if [[ ! -f "$notes" ]]; then
            echo 'No release notes for this version; deployment only'; exit 0
          fi
          tag="v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists'
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "KnightUp $version" --notes-file "$notes"
          fi
